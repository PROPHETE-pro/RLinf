defaults:
  - env/robotwin_open_microwave@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout: 0-3
    env: 4-7

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_open_microwave_openpi_pi05_opd"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null
env:
  group_name: "EnvGroup"
  enable_offload: True
  eval:
    rollout_epoch: 1
    total_num_envs: 100
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 1500
    reward_coef: 1.0
    # open_microwave: 100 eval seeds; ceil(100 / 128) = 1 round
    max_steps_per_rollout_epoch: 1500
    group_size: 1
    use_fixed_reset_state_ids: False
    is_eval: True
    assets_path: "/mnt/pfs/7wsqem/grt/RoboTwin"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      step_lim: 1500
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/mnt/pfs/7wsqem/grt/openpi/checkpoints/pi05_robotwin_4task/pi05_robotwin_4task_torch"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: True
    num_steps: 5
    openpi:
      add_value_head: True
      config_name: "pi05_robotwin_4task"
      num_images_in_input: 3
      noise_level: 0.3
      max_token_len: 250
      detach_critic_input: True
