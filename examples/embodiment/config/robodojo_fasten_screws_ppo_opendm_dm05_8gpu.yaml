# 8-GPU PPO on RoboDojo fasten_screws (Dual ARX5 / OpenDM dm05_robodojo).
# Official step_lim=1900, train horizon is 2x (3800).
# 16 envs / 8 GPUs = 2 Isaac per GPU. env offload closes Isaac after each interact.
# rollout/rank = (16*4/8)*(3800/25) = 1216. per-rank batch is 32:
# 1216 % 32 = 0. global_batch_size=256, 256 % (16*8) = 0.
defaults:
  - env/robodojo@env.train
  - env/robodojo@env.eval
  - model/opendm_dm05@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robodojo_fasten_screws_ppo_opendm_dm05_8gpu"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: action_level
  intra_chunk_advantage: True
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 20.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: True
  train:
    rollout_epoch: 4
    total_num_envs: 16
    chunk_step_timeout_sec: 0
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 3800
    max_steps_per_rollout_epoch: 3800
    group_size: ${algorithm.group_size}
    seed: 0
    layout_mode: procedural
    use_fixed_reset_state_ids: False
    center_crop: False
    use_dense_reward: True
    dense_shaping_coef: 0.7
    dense_success_reward: 1.0
    use_rel_reward: False
    use_custom_reward: True
    official_step_lim: 1900
    rollout_step_lim: 3800
    # Full success reward until official_step_lim. After that,
    # scale = exp(-(step - official) / (0.5 * official)).
    success_deadline_mode: decay
    success_decay_steps: 950
    time_cost_per_step: 0.0
    # Close Isaac after each interact so the RTX descriptor heap does not accumulate.
    enable_offload: True
    auto_task_horizon: True
    video_cfg:
      save_video: False
      video_stride: -1
      fps: 25
    task_config:
      task_name: fasten_screws
      step_lim: 1900
      action_type: joint
  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    use_dense_reward: True
    use_rel_reward: False
    use_custom_reward: True
    max_episode_steps: 1900
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 1900
    group_size: 1
    use_fixed_reset_state_ids: False
    is_eval: True
    layout_mode: eval_json
    # Close Isaac after each interact so the RTX descriptor heap does not accumulate.
    enable_offload: True
    video_cfg:
      save_video: True
      video_stride: -1
      fps: 25
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      task_name: fasten_screws
      step_lim: 1900
      action_type: joint

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: True
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  # world_size=8: 256 % (16*8)=0；per-rank batch=32
  # rollout/rank = (16*4/8)*(3800/25) = 1216，1216 % 32 = 0
  global_batch_size: 256
  seed: 1234
  enable_offload: True

  model:
    model_path: "/kpfs_ssd/data/ruitong_gan/opendm/user_checkpoints/dm05_robodojo_3task_sft/checkpoint-20000"
    precision: "bf16"
    # The checkpoint still predicts 50 actions. The env executes the first 25,
    # then replans, matching the official OpenDM eval contract.
    num_action_chunks: 25
    action_dim: 14
    add_value_head: True
    num_steps: 5
    opendm:
      num_images_in_input: 3
      image_prompts: ["Head", "Left wrist", "Right wrist"]
      robot_type: "Dual ARX5"
      add_state: True
      action_mode: "absolute"
      noise_level: 0.3
      # Five denoise steps. SDE noise is applied to one of the first four only.
      ignore_last: true
      is_history: true
      history_slots: 20
      # Official prompt length. History adds 32 slots * 16 tokens.
      max_length: 1536
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      add_value_head: ${actor.model.add_value_head}
      detach_critic_input: True
      default_control_mode: "joint"

  optim:
    lr: 2.0e-06
    value_lr: 5.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 300
    # Resume a checkpoint saved after warmup with this set to true.
    skip_critic_warmup: false

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
