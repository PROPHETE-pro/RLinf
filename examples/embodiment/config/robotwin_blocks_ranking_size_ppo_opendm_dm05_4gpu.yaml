# 4-GPU PPO on OpenDM dm05_robotwin. Training knobs aligned with the
# 4gpu OpenPI recipe (32 train envs, eval 16, critic warmup, no SFT),
# but train reset is unfrozen (normal seed sampling). Horizon=1200.
# 4xGPU: 8 SubEnvs/GPU → 32 train envs.
# rollout/rank = (32*4/4)*(1200/50) = 768, 768 % 128 = 0.
defaults:
  - env/robotwin_blocks_ranking_size@env.train
  - env/robotwin_blocks_ranking_size@env.eval
  - model/opendm_dm05@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
    env: 0-3
    rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_blocks_ranking_size_ppo_opendm_dm05_4gpu"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null
  keep_critic_weight: False

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 8
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 20.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 4
    total_num_envs: 32
    chunk_step_timeout_sec: 60.0
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 1200
    max_steps_per_rollout_epoch: 1200
    group_size: ${algorithm.group_size}
    assets_path: "/kpfs/data/ruitong_gan/RoboTwin"
    seeds_path: null
    use_fixed_reset_state_ids: False
    instruction_type: full_description
    center_crop: False
    use_dense_reward: True
    use_rel_reward: True
    use_custom_reward: False
    dense_shaping_coef: 0.5
    dense_success_reward: 1.0
    video_cfg:
      save_video: False
    task_config:
      step_lim: 1200
      planner_backend: mplib
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    use_dense_reward: True
    use_rel_reward: True
    use_custom_reward: False
    dense_shaping_coef: 0.5
    dense_success_reward: 1.0
    max_episode_steps: 1200
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 2400
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/kpfs/data/ruitong_gan/RoboTwin"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    instruction_type: full_description
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      planner_backend: mplib
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  # 整除约束（world_size=4）：512 % (32*4)=0；per-rank batch=128
  # RoboTwin 官方 step_lim=1200；rollout/rank = (32*4/4)*(1200/50) = 768，768 % 128 = 0
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_path: "/kpfs/data/ruitong_gan/opendm/checkpoints/dm05_robotwin"
    precision: "bf16"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: True
    num_steps: 5
    opendm:
      num_images_in_input: 3
      image_prompts: ["Head", "Left wrist", "Right wrist"]
      robot_type: "Aloha RoboTwin2"
      add_state: True
      action_mode: "absolute"
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      add_value_head: ${actor.model.add_value_head}
      detach_critic_input: True

  optim:
    lr: 5.0e-06
    value_lr: 5.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 300

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
