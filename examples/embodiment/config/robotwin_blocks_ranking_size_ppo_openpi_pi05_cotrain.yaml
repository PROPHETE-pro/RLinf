defaults:
  - env/robotwin_blocks_ranking_size@env.train
  - env/robotwin_blocks_ranking_size@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
    env: 0-7
    rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_blocks_ranking_size_ppo_openpi_pi05_cotrain"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  # Best available RL policy ckpt (success_once~28.1% @ step 120). keep_critic_weight=False
  # drops value_head so dense training starts with a randomly initialized critic.
  ckpt_path: "/mnt/pfs/7wsqem/grt/RLinf/logs/20260730-17:39:26-robotwin_blocks_ranking_size_ppo_openpi_pi05_cotrain/robotwin_blocks_ranking_size_ppo_openpi_pi05_cotrain/checkpoints/global_step_70/actor/model_state_dict/full_weights.pt"
  keep_critic_weight: False

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 8
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 20.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 4
    total_num_envs: 32
    chunk_step_timeout_sec: 60.0
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 1200
    max_steps_per_rollout_epoch: 1200
    group_size: ${algorithm.group_size}
    assets_path: "/mnt/pfs/7wsqem/grt/RoboTwin"
    seeds_path: null
    center_crop: False
    video_cfg:
      save_video: True
    task_config:
      step_lim: 1200
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    use_dense_reward: False
    use_custom_reward: False
    max_episode_steps: 1200
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 2400
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/mnt/pfs/7wsqem/grt/RoboTwin"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  # 整除约束（world_size=8）：1024 % (32*8)=0；per-rank batch=128
  # RoboTwin 官方 step_lim=1200；rollout/rank = (32*4/8)*(1200/50) = 384，384 % 128 = 0
  global_batch_size: 1024
  seed: 1234
  enable_offload: False

  # SFT co-training
  enable_sft_co_train: True
  config_name: "pi05_robotwin_4task"
  sft_data_path: "/mnt/pfs/7wsqem/grt/starVLA/playground/Datasets/RoboTwin/Clean/blocks_ranking_size"
  sft_loss_weight: 2.0

  model:
    model_path: "/mnt/pfs/7wsqem/grt/openpi/checkpoints/pi05_robotwin_4task/pi05_robotwin_4task_blocks_ranking_size_torch"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: True
    num_steps: 5
    openpi:
      config_name: "pi05_robotwin_4task"
      num_images_in_input: 3
      noise_level: 0.1
      max_token_len: 250
      detach_critic_input: True

  optim:
    lr: 5.0e-06
    value_lr: 5.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 300

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
