defaults:
  - env/robotwin_lwd_multitask@env.train
  - env/robotwin_lwd_multitask@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # 单卡冒烟默认：三组件共置在 GPU 0。多卡时改成 0-7 或 all。
  # 不要用 "env, rollout, actor" 这种逗号合并键——Hydra CLI 无法可靠覆盖。
  component_placement:
    env: 0
    rollout: 0
    actor: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_lwd_openpi_pi05_1task"
    logger_backends: ["tensorboard"]

  max_epochs: 100
  max_steps: -1
  # offline | online — offline samples B_off only; online mixes B_off ∪ B_on
  lwd_stage: online

  only_eval: False
  val_check_interval: -1
  save_interval: 20
  weight_sync_interval: 10

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 50
  adv_type: embodied_sac
  loss_type: embodied_lwd
  loss_agg_func: "token-mean"

  gamma: 0.999
  tau: 0.005
  demo_ratio: 0.5
  allow_demo_only: false

  lwd:
    tau_base: 0.5
    tau_min: 0.1
    tau_max: 0.9
    alpha: 1.0
    num_atoms: 51
    v_min: 0.0
    v_max: 1.0
    qam_lambda: 1.0
    agg_q: min
    finetune_backbone_offline: true

  demo_buffer:
    enable_cache: True
    cache_size: 5000
    sample_window_size: 5000
    min_buffer_size: 1
    auto_save: False
    # Set to a converted LeRobot/trajectory checkpoint for offline smoke.
    load_path: null

  replay_buffer:
    enable_cache: True
    cache_size: 5000
    sample_window_size: 5000
    min_buffer_size: 10
    auto_save: False

  target_update_freq: 1
  target_update_type: all

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: False
    use_rel_reward: False
    use_custom_reward: True
    use_dense_reward: False
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    assets_path: "/mnt/pfs/7wsqem/grt/RoboTwin"
    seeds_path: null
    # N=1 smoke: short-horizon task
    task_names:
      - place_mouse_pad
    task_config:
      task_name: place_mouse_pad
      step_lim: 400
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: False
    use_custom_reward: True
    use_dense_reward: False
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    is_eval: True
    assets_path: "/mnt/pfs/7wsqem/grt/RoboTwin"
    seeds_path: null
    task_names:
      - place_mouse_pad
    task_config:
      task_name: place_mouse_pad
      step_lim: 400
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 64
  seed: 42
  enable_offload: False

  model:
    model_path: "/mnt/pfs/7wsqem/grt/openpi/checkpoints/pi05_robotwin_4task/pi05_robotwin_4task_torch"
    num_action_chunks: 50
    action_dim: 14
    num_steps: 5
    add_value_head: False
    add_q_head: False

    openpi:
      config_name: "pi05_robotwin_4task"
      num_images_in_input: 3
      noise_level: 0.3
      max_token_len: 250
      train_expert_only: True
      action_env_dim: 14
      use_dsrl: False
      use_lwd: True
      lwd_state_dim: 14
      lwd_num_q_heads: 2
      lwd_num_atoms: 51
      lwd_v_min: 0.0
      lwd_v_max: 1.0
      lwd_image_latent_dim: 64
      lwd_state_latent_dim: 64
      lwd_action_latent_dim: 64
      lwd_hidden_dims: [128, 128, 128]
      lwd_agg_q: min

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  value_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
