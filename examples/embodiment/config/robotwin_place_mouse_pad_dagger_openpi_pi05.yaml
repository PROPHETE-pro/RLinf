defaults:
  - env/robotwin_place_mouse_pad@env.train
  - env/robotwin_place_mouse_pad@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
    env: 0-7
    rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_place_mouse_pad_dagger_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  reward_coef: 1.0

  dagger:
    # Expert acts with probability beta; student acts with probability 1 - beta.
    init_beta: 0.8
    beta_schedule: "exponential"
    beta_decay: 0.995
    beta_min: 0.05
    # False = classic DAgger: student-acted steps are re-labeled by expert.
    only_save_expert: False

  gamma: 0.99

  update_epoch: 4
  adv_type: gae
  loss_type: embodied_dagger

  replay_buffer:
    enable_cache: True
    cache_size: 4000
    min_buffer_size: 32
    sample_window_size: 4000
    auto_save: False

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 4
    total_num_envs: 32
    chunk_step_timeout_sec: 60.0
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    group_size: 1
    assets_path: "/kpfs/data/ruitong_gan/RoboTwin"
    seeds_path: null
    center_crop: False
    video_cfg:
      save_video: True
    task_config:
      step_lim: 400
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 64
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 400
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 800
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/kpfs/data/ruitong_gan/RoboTwin"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_prev_infos: False

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

  # Frozen SFT checkpoint acts as expert (teacher).
  expert_model:
    model_path: "/kpfs/data/ruitong_gan/openpi/checkpoints/pi05_robotwin_4task/pi05_robotwin_4task_place_mouse_pad_torch"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 1024
  seed: 1234
  enable_offload: False

  model:
    model_path: "/kpfs/data/ruitong_gan/openpi/checkpoints/pi05_robotwin_4task/pi05_robotwin_4task_place_mouse_pad_torch"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    num_steps: 5
    openpi:
      config_name: "pi05_robotwin_4task"
      num_images_in_input: 3
      noise_level: 0.1
      max_token_len: 250
      detach_critic_input: True

  optim:
    lr: 5.0e-06
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
