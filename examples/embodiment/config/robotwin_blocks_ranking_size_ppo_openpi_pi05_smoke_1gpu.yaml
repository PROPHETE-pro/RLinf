# Single-A100 smoke: 1 PPO epoch on blocks_ranking_size, no eval / ckpt / video / co-train.
# GPU world_size=1. Rollout samples = (2 envs * 1 epoch / 1 GPU) * (50/50 chunks) = 2.
# Constraint: global_batch_size % (micro_batch_size * world_size) == 0 → 2 % (2 * 1) == 0.
defaults:
  - env/robotwin_blocks_ranking_size@env.train
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_blocks_ranking_size_ppo_openpi_pi05_smoke_1gpu"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: True
  train:
    rollout_epoch: 1
    total_num_envs: 2
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    group_size: ${algorithm.group_size}
    assets_path: "/kpfs/data/ruitong_gan/RoboTwin"
    seeds_path: null
    center_crop: False
    use_dense_reward: False
    use_rel_reward: False
    enable_offload: True
    # 13-CPU 开发机: skip extra SAPIEN subprocesses for the smoke run.
    use_subproc_env: false
    video_cfg:
      save_video: False
    task_config:
      step_lim: 50
      embodiment: [aloha-agilex]
      planner_backend: mplib
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 2
  seed: 1234
  enable_offload: True

  model:
    model_path: "/kpfs/data/ruitong_gan/openpi/checkpoints/pi05_robotwin_4task/pi05_robotwin_4task_blocks_ranking_size_torch"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: True
    num_steps: 5
    openpi:
      config_name: "pi05_robotwin_4task"
      num_images_in_input: 3
      noise_level: 0.3
      max_token_len: 250
      detach_critic_input: True

  optim:
    lr: 5.0e-06
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
